name: Atualizar grade Claro TV
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Atualizar e validar a cada 72 horas
        id: update
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && -f .last-update ]]; then
            last=$(cat .last-update)
            now=$(date -u +%s)
            if (( now - last < 259200 )); then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          node scripts/update-data.cjs
          node scripts/build.cjs
          node scripts/validate.cjs
          date -u +%s > .last-update
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Gravar atualização validada
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .last-update scripts/update-manifest.json
          git diff --cached --quiet || git commit -m "Atualiza grade de programação"
          git push
      - uses: actions/configure-pages@v5
        if: steps.update.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.update.outputs.changed == 'true'
        with:
          path: .
      - uses: actions/deploy-pages@v4
        if: steps.update.outputs.changed == 'true'
